<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script>
        // GitHub Pages SPA routing: redirect route paths and .aspx routes to the report viewer
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        var repoPrefix = '';
        if (path.indexOf('/arthurcinetica') === 0) {
            repoPrefix = '/arthurcinetica';
        }

        var anonymousBase = repoPrefix + '/Corpore.Net/Source/Rpt-GeradorRelatoriosNet/RM.Rpt.Reports/Anonymous/';
        var numMatch = path.match(/\b(27\d{5}|\d{5,10})\b/);

        if (numMatch) {
            var pdfNum = numMatch[1];
            if (search) {
                if (search.indexOf('GUID=') === -1) {
                    search += '&GUID=a0db33c1-6628-428d-9b60-f155fd2fb270&anonymous=true';
                }
            } else {
                search = '?' + pdfNum + '&GUID=a0db33c1-6628-428d-9b60-f155fd2fb270&anonymous=true';
            }
            window.location.replace(anonymousBase + search + hash);
        } else if (path.indexOf('RptReportViewerAnonymous.aspx') !== -1) {
            var newPath = path.replace('RptReportViewerAnonymous.aspx', '');
            window.location.replace(newPath + search + hash);
        } else {
            var defaultQuery = search || '?GUID=a0db33c1-6628-428d-9b60-f155fd2fb270&anonymous=true';
            window.location.replace(anonymousBase + defaultQuery + hash);
        }
    </script>
</head>
<body></body>
</html>
