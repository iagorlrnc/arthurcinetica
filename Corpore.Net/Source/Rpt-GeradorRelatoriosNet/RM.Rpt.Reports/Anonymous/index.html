<!DOCTYPE html>
<html>
<head id="Head1">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="../../../../../styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="pdfData.js"></script>
</head>
<body>
    <form id="form1">

        <table style="width: 100%;">
            <tr>
                <td>
                    <!-- Toolbar -->
                    <div class="dxmLite dxm-ltr">
                        <div class="dxm-main dxm-horizontal dxmtb" id="ReportToolbar1_Menu">
                            <ul class="dx dxm-image-l">
                                <!-- Search button -->
                                <li title="Exibe a janela de pesquisa" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-search" title="Exibe a janela de pesquisa"></span>
                                    </div>
                                </li>

                                <li class="dxm-separator"><b></b></li>

                                <!-- Print button -->
                                <li title="Imprime o relatório" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-print" title="Imprime o relatório"></span>
                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Print Page button -->
                                <li title="Imprime a página atual" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-print-page" title="Imprime a página atual"></span>
                                    </div>
                                </li>

                                <li class="dxm-separator"><b></b></li>

                                <!-- First Page -->
                                <li title="Primeira Página" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-first-page" title="Primeira Página"></span>
                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Previous Page -->
                                <li title="Página Anterior" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-prev-page" title="Página Anterior"></span>
                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- "Página" label -->
                                <li class="dxm-item dxtb-labelMenuItem dxm-noImage dxm-tmpl">
                                    <span class="dxeBase" style="margin-left:3px;margin-right:3px;">Página</span>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Page Number Combo -->
                                <li class="dxm-item dxtb-comboBoxMenuItem dxm-noImage dxm-tmpl">
                                    <table class="dxeButtonEditSys dxeButtonEdit" id="ReportToolbar1_Menu_ITCNT6_PageNumber" style="width:65px;">
                                        <tr>
                                            <td class="dxic" style="width:100%;">
                                                <input class="dxeEditArea dxeEditAreaSys" id="ReportToolbar1_Menu_ITCNT6_PageNumber_I" value="1" type="text" readonly />
                                            </td>
                                            <td class="dxeButton dxeButtonEditButton">
                                                <span class="dropdown-arrow"></span>
                                            </td>
                                        </tr>
                                    </table>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- "de" label -->
                                <li class="dxm-item dxtb-labelMenuItem dxm-noImage dxm-tmpl">
                                    <span class="dxeBase" style="margin-left:3px;margin-right:3px;">de</span>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Page Count -->
                                <li class="dxm-item dxtb-comboBoxMenuItem dxm-noImage dxm-tmpl">
                                    <table class="dxeTextBoxSys dxeTextBox dxeReadOnly" id="ReportToolbar1_Menu_ITCNT8_PageCount" style="width:1em;">
                                        <tr>
                                            <td class="dxic" style="width:100%;">
                                                <input class="dxeEditArea dxeEditAreaSys" value="1" type="text" readonly style="width:1em;text-align:Center;" />
                                            </td>
                                        </tr>
                                    </table>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Next Page -->
                                <li title="Próxima Página" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-next-page" title="Próxima Página"></span>
                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Last Page -->
                                <li title="Última Página" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-last-page" title="Última Página"></span>
                                    </div>
                                </li>

                                <li class="dxm-separator"><b></b></li>

                                <!-- Save/Export button -->
                                <li title="Exporta o relatório e exibe em uma nova janela" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-save" title="Exporta o relatório e exibe em uma nova janela"></span>
                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Save Format Combo -->
                                <li class="dxm-item dxtb-comboBoxMenuItem dxm-noImage dxm-tmpl">
                                    <table class="dxeButtonEditSys dxeButtonEdit" id="ReportToolbar1_Menu_ITCNT12_SaveFormat" style="width:150px;">
                                        <tr>
                                            <td class="dxic" style="width:100%;">
                                                <input class="dxeEditArea dxeEditAreaSys" id="ReportToolbar1_Menu_ITCNT12_SaveFormat_I" value="Pdf" type="text" readonly />
                                            </td>
                                            <td class="dxeButton dxeButtonEditButton">
                                                <span class="dropdown-arrow"></span>
                                            </td>
                                        </tr>
                                    </table>
                                </li>
                            </ul>
                        </div>
                        <b class="dx-clear"></b>
                    </div>
                </td>
            </tr>
            <tr style="width: 100%;">
                <td style="width: 100%;">
                    <div id="ReportViewer1_Div" style="width:100%;background-color:#ffffff;text-align:center;">
                        <!-- PDF Viewer container with pure white background -->
                        <div id="pdfContainer" style="background-color:#ffffff;display:inline-block;padding:15px 0 40px 0;text-align:center;">
                            <canvas id="pdfCanvas" style="background-color:#ffffff;box-shadow:none;border:none;max-width:100%;height:auto;display:block;margin:0 auto;"></canvas>
                        </div>
                        <iframe id="pdfFrame" src="2789778.pdf" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:none;"></iframe>
                    </div>
                </td>
            </tr>
        </table>

    <!-- Hidden download link outside the form -->
    <a id="downloadLink" href="2789778.pdf" download="2789778.pdf" style="display:none;"></a>

    <script>
        var PDF_FILE = '2789778.pdf';

        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        function loadAndRenderPdf() {
            var loadingTask = null;
            if (typeof PDF_BASE64 !== 'undefined' && PDF_BASE64) {
                try {
                    var raw = atob(PDF_BASE64);
                    var uint8 = new Uint8Array(raw.length);
                    for (var i = 0; i < raw.length; i++) {
                        uint8[i] = raw.charCodeAt(i);
                    }
                    loadingTask = pdfjsLib.getDocument({ data: uint8 });
                } catch (e) {
                    console.warn('Base64 decode failed, fallback to URL:', e);
                }
            }
            if (!loadingTask && typeof pdfjsLib !== 'undefined') {
                loadingTask = pdfjsLib.getDocument(PDF_FILE);
            }

            if (loadingTask) {
                loadingTask.promise.then(function(pdf) {
                    return pdf.getPage(1);
                }).then(function(page) {
                    var container = document.getElementById('ReportViewer1_Div');
                    var canvas = document.getElementById('pdfCanvas');
                    if (!canvas) return;
                    var context = canvas.getContext('2d');

                    var initialViewport = page.getViewport({ scale: 1.0 });
                    var availableWidth = container ? container.clientWidth - 40 : 850;
                    if (availableWidth <= 0) availableWidth = 850;
                    var dpr = window.devicePixelRatio || 1;
                    var cssScale = Math.min(availableWidth / initialViewport.width, 1.25);
                    var scale = cssScale * dpr;

                    var viewport = page.getViewport({ scale: scale });
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.width = (viewport.width / dpr) + 'px';
                    canvas.style.height = (viewport.height / dpr) + 'px';

                    var renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                }).catch(function(err) {
                    console.warn('PDF.js rendering error, fallback to iframe:', err);
                    fallbackToIframe();
                });
            } else {
                fallbackToIframe();
            }
        }

        function fallbackToIframe() {
            var frame = document.getElementById('pdfFrame');
            var container = document.getElementById('pdfContainer');
            if (frame && container) {
                container.style.display = 'none';
                frame.style.position = 'static';
                frame.style.left = 'auto';
                frame.style.top = 'auto';
                frame.style.width = '100%';
                frame.style.height = '100%';
            }
        }

        // Attach events after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadAndRenderPdf();

            // Map button titles to actions
            var buttonMap = {
                'Exibe a janela de pesquisa': 'search',
                'Imprime o relatório': 'print',
                'Imprime a página atual': 'printPage',
                'Primeira Página': 'firstPage',
                'Página Anterior': 'prevPage',
                'Próxima Página': 'nextPage',
                'Última Página': 'lastPage',
                'Exporta o relatório e exibe em uma nova janela': 'save'
            };

            // Attach click handlers to all toolbar items by title
            var items = document.querySelectorAll('.dxm-item[title]');
            for (var i = 0; i < items.length; i++) {
                (function(item) {
                    var action = buttonMap[item.getAttribute('title')];
                    if (action) {
                        item.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            toolbarAction(action);
                        });
                    }
                })(items[i]);
            }
        });

        function toolbarAction(action) {
            var iframe = document.getElementById('pdfFrame');

            switch (action) {
                case 'search':
                    // Open PDF in new tab where user can search
                    window.open(PDF_FILE, '_blank');
                    break;

                case 'print':
                case 'printPage':
                    // Print the PDF
                    try {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                    } catch (e) {
                        window.print();
                    }
                    break;

                case 'firstPage':
                case 'prevPage':
                case 'nextPage':
                case 'lastPage':
                    updatePageNumber(1);
                    break;

                case 'save':
                    // Force download of the PDF
                    document.getElementById('downloadLink').click();
                    break;
            }
        }

        function getCurrentPage() {
            var input = document.getElementById('ReportToolbar1_Menu_ITCNT6_PageNumber_I');
            return parseInt(input.value) || 1;
        }

        function getTotalPages() {
            var inputs = document.querySelectorAll('#ReportToolbar1_Menu_ITCNT8_PageCount input');
            for (var i = 0; i < inputs.length; i++) {
                var val = parseInt(inputs[i].value);
                if (!isNaN(val)) return val;
            }
            return 1;
        }

        function updatePageNumber(num) {
            document.getElementById('ReportToolbar1_Menu_ITCNT6_PageNumber_I').value = num;
        }
    </script>
</body>
</html>
