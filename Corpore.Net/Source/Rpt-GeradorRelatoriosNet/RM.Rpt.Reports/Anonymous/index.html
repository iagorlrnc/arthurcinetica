<body>
    <form id="form1">

        <table style="width: 100%;">
            <tr>
                <td>
                    <!-- Toolbar -->
                    <div class="dxmLite dxm-ltr">
                        <div class="dxm-main dxm-horizontal dxmtb" id="ReportToolbar1_Menu">

                                </li>

                                <li class="dxm-spacing"></li>

                                    </div>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- "Página" label -->
                                <li class="dxm-item dxtb-labelMenuItem dxm-noImage dxm-tmpl">
                                    <span class="dxeBase" style="margin-left:3px;margin-right:3px;">Página</span>
                                </li>

                                <li class="dxm-spacing"></li>

                                <!-- Page Number Combo -->
                                <li class="dxm-item dxtb-comboBoxMenuItem dxm-noImage dxm-tmpl">
                                    <table class="dxeButtonEditSys dxeButtonEdit" id="ReportToolbar1_Menu_ITCNT6_PageNumber" style="width:65px;">

                                <!-- "de" label -->
                                <li class="dxm-item dxtb-labelMenuItem dxm-noImage dxm-tmpl">
                                    <span class="dxeBase" style="margin-left:3px;margin-right:3px;">de</span>

                                <li title="Próxima Página" class="dxm-item">

                                <li class="dxm-separator"><b></b></li>

                                <!-- Save/Export button -->
                                <li title="Exporta o relatório e exibe em uma nova janela" class="dxm-item">
                                    <div class="dxm-content">
                                        <span class="toolbar-icon icon-save" title="Exporta o relatório e exibe em uma nova janela"></span>
                                    </div>

                                <li class="dxm-spacing"></li>

                                <!-- Save Format Combo -->
                                <li class="dxm-item dxtb-comboBoxMenuItem dxm-noImage dxm-tmpl">
                                    <table class="dxeButtonEditSys dxeButtonEdit" id="ReportToolbar1_Menu_ITCNT12_SaveFormat" style="width:150px;">
                                        <tr>
                                            <td class="dxic" style="width:100%;">
                                                <input class="dxeEditArea dxeEditAreaSys" id="ReportToolbar1_Menu_ITCNT12_SaveFormat_I" value="Pdf" type="text" readonly />

                        </div>

            </tr>
            <tr style="width: 100%;">
                <td style="width: 100%;">
                    <div id="ReportViewer1_Div" style="width:100%;background-color:#ffffff;text-align:center;">
                        <!-- PDF Viewer container with pure white background -->
                        <div id="pdfContainer" style="background-color:#ffffff;display:block;margin:0 auto;padding:15px 10px 40px 10px;text-align:center;width:100%;max-width:898px;box-sizing:border-box;">
                            <canvas id="pdfCanvas" style="background-color:#ffffff;box-shadow:none;border:none;width:100%;max-width:878px;height:auto;display:block;margin:0 auto;aspect-ratio:877.5/962.25;"></canvas>
                        </div>
                        <iframe id="pdfFrame" src="2789778.pdf" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:none;"></iframe>
                    </div>
                </td>
            </tr>
        </table>

    <!-- Hidden download link outside the form -->
    <a id="downloadLink" href="2789778.pdf" download="2789778.pdf" style="display:none;"></a>

    <script>
        function resolvePdfId() {
            var params = new URLSearchParams(window.location.search);

            // 1. Check explicit query params
            var candidateParams = ['pdf', 'id', 'file', 'report', 'relatorio', 'doc', 'r'];
            for (var i = 0; i < candidateParams.length; i++) {
                var val = params.get(candidateParams[i]);
                if (val) {
                    var num = val.replace(/\.pdf$/i, '').trim();
                    if (num) return num;
                }
            }

            // 2. Check query string itself (e.g. ?2702748 or ?2702748.pdf)
            var search = window.location.search.replace(/^\?/, '');
            if (search) {
                var searchParts = search.split('&');
                for (var s = 0; s < searchParts.length; s++) {
                    var part = searchParts[s].split('=')[0];
                    part = part.replace(/\.pdf$/i, '');
                    var m = part.match(/^\d{5,10}$/);
                    if (m) return m[0];
                }
                var guid = params.get('GUID');
                if (guid) {
                    var guidMatch = guid.match(/\b(27\d{5}|\d{5,10})\b/);
                    if (guidMatch) return guidMatch[1];
                }
            }

            // 3. Check hash (e.g. #2702748 or #pdf=2702748)
            var hash = window.location.hash.replace(/^#\/?/, '');
            if (hash) {
                var hashMatch = hash.match(/\b(27\d{5}|\d{5,10})\b/);
                if (hashMatch) return hashMatch[1];
            }

            // 4. Check pathname segments from right to left
            var pathSegments = window.location.pathname.split('/').filter(Boolean);
            for (var j = pathSegments.length - 1; j >= 0; j--) {
                var seg = pathSegments[j].replace(/\.(html|aspx|pdf)$/i, '');
                var segMatch = seg.match(/\b(\d{5,10})\b/);
                if (segMatch) {
                    return segMatch[1];
                }
            }

            // Default fallback
            return '2789778';
        }

        var PDF_ID = resolvePdfId();
        var PDF_FILE = PDF_ID + '.pdf';
        var currentRenderTask = null;

        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        function updateDomElements(id) {
            PDF_ID = id;
            PDF_FILE = id + '.pdf';

            var frame = document.getElementById('pdfFrame');
            if (frame) frame.src = PDF_FILE;

            var dlink = document.getElementById('downloadLink');
            if (dlink) {
                dlink.href = PDF_FILE;
                dlink.download = PDF_FILE;
            }

            // Ensure address bar URL has: ?<file_name>&GUID=a0db33c1-6628-428d-9b60-f155fd2fb270&anonymous=true
            if (window.history && window.history.replaceState) {
                var currentSearch = window.location.search;
                var guidParam = 'GUID=a0db33c1-6628-428d-9b60-f155fd2fb270&anonymous=true';
                if (!currentSearch || currentSearch === '?' || currentSearch.indexOf('GUID=') === -1) {
                    var newSearch = '?' + id + '&' + guidParam;
                    window.history.replaceState(null, '', window.location.pathname + newSearch + window.location.hash);
                }
            }
        }

        function loadAndRenderPdf() {
            var newId = resolvePdfId();
            updateDomElements(newId);

            var loadingTask = null;
            var base64Data = (typeof PDF_DATA !== 'undefined' && PDF_DATA[PDF_ID]) ||
                             (PDF_ID === '2789778' && typeof PDF_BASE64 !== 'undefined' ? PDF_BASE64 : null);

            if (base64Data) {
                try {
                    var raw = atob(base64Data);
                    var uint8 = new Uint8Array(raw.length);
                    for (var i = 0; i < raw.length; i++) {
                        uint8[i] = raw.charCodeAt(i);
                    }
                    loadingTask = pdfjsLib.getDocument({ data: uint8 });
                } catch (e) {
                    console.warn('Base64 decode failed, fallback to URL:', e);
                }
            }
            if (!loadingTask && typeof pdfjsLib !== 'undefined') {
                loadingTask = pdfjsLib.getDocument(PDF_FILE);
            }

            if (loadingTask) {
                loadingTask.promise.then(function(pdf) {
                    return pdf.getPage(1);
                }).then(function(page) {
                    var canvas = document.getElementById('pdfCanvas');
                    if (!canvas) return;
                    var context = canvas.getContext('2d');

                    if (currentRenderTask) {
                        try {
                            currentRenderTask.cancel();
                        } catch (e) {}
                        currentRenderTask = null;
                    }

                    context.clearRect(0, 0, canvas.width, canvas.height);

                    var initialViewport = page.getViewport({ scale: 1.0 });
                    var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2), 3);
                    var renderScale = 1.0 * dpr;

                    var viewport = page.getViewport({ scale: renderScale });
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.width = '100%';
                    canvas.style.maxWidth = initialViewport.width + 'px';
                    canvas.style.height = 'auto';
                    canvas.style.aspectRatio = initialViewport.width + ' / ' + initialViewport.height;

                    var renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    currentRenderTask = page.render(renderContext);
                    return currentRenderTask.promise;
                }).catch(function(err) {
                    if (err && err.name === 'RenderingCancelledException') return;
                    console.warn('PDF.js rendering error, fallback to iframe:', err);
                    fallbackToIframe();
                });
            } else {
                fallbackToIframe();
            }
        }

        function fallbackToIframe() {
            var frame = document.getElementById('pdfFrame');
            var container = document.getElementById('pdfContainer');
            if (frame && container) {
                container.style.display = 'none';
                frame.style.position = 'static';
                frame.style.left = 'auto';
                frame.style.top = 'auto';
                frame.style.width = '100%';
                frame.style.height = '100%';
            }
        }

        window.addEventListener('popstate', loadAndRenderPdf);
        window.addEventListener('hashchange', loadAndRenderPdf);

        // Attach events after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadAndRenderPdf();

            // Map button titles to actions
            var buttonMap = {
                'Exibe a janela de pesquisa': 'search',
                'Imprime o relatório': 'print',
                'Imprime a página atual': 'printPage',
                'Primeira Página': 'firstPage',
                'Página Anterior': 'prevPage',
                'Próxima Página': 'nextPage',
                'Última Página': 'lastPage',
                'Exporta o relatório e exibe em uma nova janela': 'save'
            };

            // Attach click handlers to all toolbar items by title
            var items = document.querySelectorAll('.dxm-item[title]');
            for (var i = 0; i < items.length; i++) {
                (function(item) {
                    var action = buttonMap[item.getAttribute('title')];
                    if (action) {
                        item.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            toolbarAction(action);
                        });
                    }
                })(items[i]);
            }
        });

        function toolbarAction(action) {
            var iframe = document.getElementById('pdfFrame');

            switch (action) {
                case 'search':
                    // Open PDF in new tab where user can search
                    window.open(PDF_FILE, '_blank');
                    break;

                case 'print':
                case 'printPage':
                    // Print the PDF
                    try {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                    } catch (e) {
                        window.print();
                    }
                    break;

                case 'firstPage':
                case 'prevPage':
                case 'nextPage':
                case 'lastPage':
                    updatePageNumber(1);
                    break;

                case 'save':
                    // Force download of the PDF
                    document.getElementById('downloadLink').click();
                    break;
            }
        }

        function getCurrentPage() {
            var input = document.getElementById('ReportToolbar1_Menu_ITCNT6_PageNumber_I');
            return parseInt(input.value) || 1;
        }

        function getTotalPages() {
            var inputs = document.querySelectorAll('#ReportToolbar1_Menu_ITCNT8_PageCount input');
            for (var i = 0; i < inputs.length; i++) {
                var val = parseInt(inputs[i].value);
                if (!isNaN(val)) return val;
            }
            return 1;
        }

        function updatePageNumber(num) {
            document.getElementById('ReportToolbar1_Menu_ITCNT6_PageNumber_I').value = num;
        }
    </script>
